server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: worland-rent-backend
  servlet:
    multipart:
      # 导入中心 Excel + 文件对象上传(应用层再按 rule import_limit 限流)
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3308/worland_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:vend123}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      validation-query: SELECT 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 并行票各占版本号段,低版本后到也允许补跑,避免并行开发互卡
    out-of-order: true
    locations: classpath:db/migration
  mvc:
    pathmatch:
      # springfox 3 兼容:回退 AntPathMatcher(配合 SpringFoxCompatConfig)
      matching-strategy: ant_path_matcher
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Knife4j 接口文档:http://127.0.0.1:8082/api/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# SSO 留位(ole 澳乐门户单点登录,暂用占位头 UserContext 适配层;ADR-001)
sso:
  enabled: ${SSO_ENABLED:false}

logging:
  level:
    top.aole.rent: debug
