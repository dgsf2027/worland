server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: worland-rent-backend
  servlet:
    multipart:
      # 导入中心 Excel + 文件对象上传(应用层再按 rule import_limit 限流)
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3308/worland_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:vend123}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      validation-query: SELECT 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 并行票各占版本号段,低版本后到也允许补跑,避免并行开发互卡
    out-of-order: true
    locations: classpath:db/migration
  mvc:
    pathmatch:
      # springfox 3 兼容:回退 AntPathMatcher(配合 SpringFoxCompatConfig)
      matching-strategy: ant_path_matcher
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Knife4j 接口文档:http://127.0.0.1:8082/api/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# SSO 留位(ole 澳乐门户单点登录,暂用占位头 UserContext 适配层;ADR-001)
sso:
  enabled: ${SSO_ENABLED:false}

# LLM 网关(OpenAI 兼容)。三项(base-url/api-key/model)全非空 → 真调用;任一空或调用失败 → 回退 mock(零外呼)。
# key 由用户自行填 deploy/.env(LLM_API_KEY),绝不入库。base-url 到 /v1 前的前缀(网关自动补 /v1/chat/completions)。
llm:
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  # 单次调用超时(毫秒),默认 30s
  timeout-ms: ${LLM_TIMEOUT_MS:30000}
  # 自签证书/内网代理宽松容错(§4.13):true=信任所有证书
  trust-all-ssl: ${LLM_TRUST_ALL_SSL:true}

logging:
  level:
    top.aole.rent: debug

# 账号体系（2026-08-19 邀请码注册 · 全系统统一契约）
rent:
  auth:
    invite-code: ${REGISTER_INVITE_CODE:dgsd1985}
    register-default-role: ${REGISTER_DEFAULT_ROLE:业务}   # 首个注册账号自动为「老板」
    secret: ${RENT_AUTH_SECRET:rent-dev-secret-change-me}     # 生产必须配 RENT_AUTH_SECRET
    token-ttl-seconds: 2592000
    placeholder-headers-enabled: ${RENT_PLACEHOLDER_HEADERS:false}   # true 才信任 X-User-* 占位头(仅本地开发)
