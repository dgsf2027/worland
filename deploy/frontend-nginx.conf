# 前端容器内 nginx:SPA history 模式 + /api 反代到后端容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由 history 模式:找不到文件回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到后端容器(compose 内部服务名 worland-server:8082)
    # ⚠️ 上线红线 P0-C:此处(或上游中央网关)必须剥离客户端自带的 X-User-* 头再由鉴权层重注入,
    #    否则可伪造 X-User-Role:老板 绕过 RBAC。占位期务必在网关配置 proxy_set_header 清空 X-User-*。
    location /api/ {
        proxy_pass http://worland-server:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # P0-C:清空客户端伪造的身份头(真 SSO 接入后由鉴权层按 JWT 重注入)
        proxy_set_header X-User-Name "";
        proxy_set_header X-User-Role "";
        client_max_body_size 20m;   # 导入 Excel / 现场照上传
    }
}
