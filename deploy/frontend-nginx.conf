# 前端容器内 nginx:SPA history 模式 + /api 反代到后端容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由 history 模式:找不到文件回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到后端容器(compose 内部服务名 worland-server:8082)
    #
    # 🚨 上线红线(占位期身份头策略 · P0-C):
    #   接入 SSO 时,必须同时开启:
    #     ① 剥离客户端自带的 X-User-*(见下方被注释的两行 proxy_set_header ... "";)
    #     ② 由鉴权层(网关/SSO 回调)按 SSO 解析结果重注入 X-User-*
    #   否则可伪造 X-User-Role:老板 绕过 RBAC。
    #   —— 当前为【占位期】:SSO 尚未接入,后端仍以 X-User-* 占位头识别身份。
    #      若在此剥离而无重注入,则所有需身份接口一律 401(工作台/KPI 全空)。
    #      故占位期【透传】前端头以保可用性,属已知占位状态;go-live 必须翻转(启用①+②)。
    location /api/ {
        proxy_pass http://worland-server:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 🚨 go-live 必须取消下面两行的注释(剥离客户端伪造身份头),并在鉴权层按 SSO 结果重注入:
        # proxy_set_header X-User-Name "";
        # proxy_set_header X-User-Role "";
        client_max_body_size 20m;   # 导入 Excel / 现场照上传
    }
}
